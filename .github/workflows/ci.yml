name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -qq && sudo apt-get install -y mono-complete
      - name: Compile
        run: mcs -warn:4 -out:MadLib/bin/MadLib.exe MadLib/Program.cs
      - name: Smoke test (inputs flow into the story)
        run: |
          OUT=$(printf 'pink\ndogs\nice cream\n\n' | mono MadLib/bin/MadLib.exe)
          echo "$OUT" | grep -q 'Roses are pink'
          echo "$OUT" | grep -q 'dogs are blue'
          echo "$OUT" | grep -q 'I love ice cream'
