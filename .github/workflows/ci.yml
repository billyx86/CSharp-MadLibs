name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update -qq && sudo apt-get install -y mono-complete
      - name: Compile
        run: |
          mkdir -p MadLib/bin
          mcs -warn:4 -out:MadLib/bin/MadLib.exe MadLib/Program.cs
      - name: "Smoke test (story 1: inputs flow into the story)"
        run: |
          OUT=$(printf '1\npink\ndogs\nice cream\nfluffy\ncat\ngracefully\ntree\n\n' | mono MadLib/bin/MadLib.exe)
          echo "$OUT" | grep -q 'Roses are pink'
          echo "$OUT" | grep -q 'dogs are blue'
          echo "$OUT" | grep -q 'I love ice cream'
          echo "$OUT" | grep -q 'fluffy cat'
          echo "$OUT" | grep -q 'dancing gracefully under the tree'
      - name: "Smoke test (story 2: both templates selectable)"
        run: |
          OUT=$(printf '2\nsneaky\nfox\nkitchen\nchicken\nyelled\n\n' | mono MadLib/bin/MadLib.exe)
          echo "$OUT" | grep -q 'sneaky fox'
          echo "$OUT" | grep -q 'sneaked into my kitchen'
          echo "$OUT" | grep -q 'ate all of my chicken'
          echo "$OUT" | grep -q 'I yelled'
      - name: "Smoke test (story 3: The Grumpy Dragon selectable, #16)"
        run: |
          # Padded inputs, per the existing test convention; the {place} slot
          # is reused on the final line, and the trimmed word must land exactly.
          OUT=$(printf '3\n  fierce  \ndragon\ncave\ncheese\nROAR\nn\n' | mono MadLib/bin/MadLib.exe)
          echo "$OUT" | grep -q 'Long ago, a fierce dragon'
          echo "$OUT" | grep -q 'lived in the cave.'
          echo "$OUT" | grep -q 'It was always grumpy about its cheese.'
          echo "$OUT" | grep -q '"ROAR!" it roared.'
          LINE=$(echo "$OUT" | grep '^and it grumbled')
          [ "$LINE" = "and it grumbled back into the cave." ]
      - name: "Smoke test (play-again loop: 'y' re-enters, 'n' exits)"
        run: |
          OUT=$(printf '1\npink\ndogs\nice cream\nfluffy\ncat\ngracefully\ntree\ny\n2\nsneaky\nfox\nkitchen\nchicken\nyelled\nn\n' | mono MadLib/bin/MadLib.exe)
          [ "$(echo "$OUT" | grep -c 'Welcome to Mad Libs!')" -eq 2 ]
          [ "$(echo "$OUT" | grep -c 'Play again?')" -eq 2 ]
      - name: "Smoke test (EOF ends cleanly, no empty story)"
        run: |
          OUT=$(printf '' | mono MadLib/bin/MadLib.exe)
          echo "$OUT" | grep -q 'No more input - goodbye'
          ! echo "$OUT" | grep -q 'Roses are $'
      - name: "Smoke test (EOF mid-story 2 ends cleanly)"
        run: |
          OUT=$(printf '2\nsneaky\n' | mono MadLib/bin/MadLib.exe)
          echo "$OUT" | grep -q 'No more input - goodbye'
          ! echo "$OUT" | grep -q 'disappeared into the night'
      - name: "Smoke test (invalid choice rejected, then valid re-choice works, #9)"
        run: |
          # "3" is now a valid story (#16), so the invalid choices are other
          # out-of-range/garbage inputs: 9 and abc, then the valid re-choice 2.
          # The error message is built from the story count (#19), so it reads
          # "1-3" for the current three stories and tracks new stories
          # automatically.
          OUT=$(printf '9\nabc\n2\nsneaky\nfox\nkitchen\nchicken\nyelled\nn\n' | mono MadLib/bin/MadLib.exe)
          [ "$(echo "$OUT" | grep -c 'Invalid choice - please enter 1-3.')" -eq 2 ]
          echo "$OUT" | grep -q 'sneaky fox'
          ! echo "$OUT" | grep -q 'Roses are'
      - name: "Smoke test (empty word re-asked, story still fills, #11)"
        run: |
          OUT=$(printf '1\n\n  \npink\ndogs\nice cream\nfluffy\ncat\ngracefully\ntree\nn\n' | mono MadLib/bin/MadLib.exe)
          [ "$(echo "$OUT" | grep -c "Please enter a word - it can't be empty.")" -eq 2 ]
          echo "$OUT" | grep -q 'Roses are pink'
      - name: "Smoke test (play-again accepts Y/yes/' y ', rejects N, #10)"
        run: |
          # A yes-like answer (trimmed, case-insensitive) plays again -> two sessions.
          OUT=$(printf '1\npink\ndogs\nice cream\nfluffy\ncat\ngracefully\ntree\nY\n2\nsneaky\nfox\nkitchen\nchicken\nyelled\nn\n' | mono MadLib/bin/MadLib.exe)
          [ "$(echo "$OUT" | grep -c 'Welcome to Mad Libs!')" -eq 2 ]
          OUT=$(printf '1\npink\ndogs\nice cream\nfluffy\ncat\ngracefully\ntree\nyes\n2\nsneaky\nfox\nkitchen\nchicken\nyelled\nn\n' | mono MadLib/bin/MadLib.exe)
          [ "$(echo "$OUT" | grep -c 'Welcome to Mad Libs!')" -eq 2 ]
          OUT=$(printf '1\npink\ndogs\nice cream\nfluffy\ncat\ngracefully\ntree\n y \n2\nsneaky\nfox\nkitchen\nchicken\nyelled\nn\n' | mono MadLib/bin/MadLib.exe)
          [ "$(echo "$OUT" | grep -c 'Welcome to Mad Libs!')" -eq 2 ]
          # A no-like answer still quits after one session.
          OUT=$(printf '1\npink\ndogs\nice cream\nfluffy\ncat\ngracefully\ntree\nN\n' | mono MadLib/bin/MadLib.exe)
          [ "$(echo "$OUT" | grep -c 'Welcome to Mad Libs!')" -eq 1 ]
      - name: "Smoke test (whitespace-padded word is trimmed in the story, #13)"
        run: |
          # A word with trailing spaces used to print as 'Roses are pink␣␣'; the
          # output line must be exactly 'Roses are pink' with no trailing blanks.
          OUT=$(printf '1\n  pink  \ndogs\nice cream\nfluffy\ncat\ngracefully\ntree\nn\n' | mono MadLib/bin/MadLib.exe)
          LINE=$(echo "$OUT" | grep '^Roses are')
          [ "$LINE" = "Roses are pink" ]
          # Leading whitespace is trimmed the same way.
          OUT=$(printf '2\n sneaky \nfox\nkitchen\nchicken\nyelled\nn\n' | mono MadLib/bin/MadLib.exe)
          LINE=$(echo "$OUT" | grep '^Last night')
          [ "$LINE" = "Last night, a sneaky fox" ]
      - name: "Guard (Program.cs stays minimal: no dead using directives, #14)"
        run: |
          # The exercise code is meant to teach C# basics with only the
          # directives a reader needs. Fail if any of the four usings the
          # original Visual Studio template shipped with reappear.
          for u in System.Collections.Generic System.Linq System.Text System.Threading.Tasks; do
            if grep -q "using $u;" MadLib/Program.cs; then
              echo "Unexpected 'using $u;' in MadLib/Program.cs" >&2
              exit 1
            fi
          done
